[package]
name = "squeezer"
version = "0.1.0"
description = "Local-first media compression for macOS"
authors = ["Squeezer"]
edition = "2024"

[lib]
name = "squeezer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.18"
oxipng = { version = "9", default-features = false }
rfd = "0.16"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
